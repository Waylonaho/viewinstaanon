name: Daily Search Engine Auto-Indexing & DB Maintenance

on:
  schedule:
    - cron: '0 2,14 * * *' # Runs at 2:00 AM UTC and 2:00 PM UTC daily
  workflow_dispatch:       # Allows manual 1-tap test anytime

jobs:
  maintain-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Lightweight DB Health & Sitemap Count Check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/db-maintenance.mjs

      - name: Run Auto-Indexer (Google + IndexNow)
        if: github.event.schedule != '0 2 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/auto-index.mjs
